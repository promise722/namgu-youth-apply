<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부산 남구 행정동별 업종·업소 3D 지도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov.min.css">
<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.0.38/dist.min.js"></script>
<style>
:root{--bg:#0b1220;--panel:#111a2e;--line:#22304d;--ink:#eef3fb;--sub:#9fb0cc;--sea:#004090;--sky:#00a9d0;--sun:#f07a10}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Pretendard GOV','Malgun Gothic',sans-serif;overflow:hidden}
#map{position:absolute;inset:0}
.panel{position:absolute;background:rgba(17,26,46,.92);border:1px solid var(--line);border-radius:16px;padding:16px 18px;backdrop-filter:blur(8px)}
#head{left:16px;top:16px;max-width:430px}
#head h1{font-size:20px;margin:0 0 4px}
#head p{margin:0;color:var(--sub);font-size:13px;line-height:1.5}
.seg{display:flex;gap:4px;background:#0b1220;border-radius:999px;padding:4px;margin-top:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--sub);font:inherit;font-weight:600;font-size:13px;padding:9px 10px;border-radius:999px;cursor:pointer;min-height:40px}
.seg button[aria-pressed=true]{background:var(--sky);color:#04121f}
label.sel{display:block;margin-top:10px;font-size:13px;color:var(--sub)}
select{width:100%;margin-top:4px;background:#0b1220;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;min-height:40px}
#legend{left:16px;bottom:16px;max-width:430px;font-size:13px}
#legend .row{display:flex;flex-wrap:wrap;gap:6px 12px}
#legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#legend .ramp{height:12px;border-radius:6px;margin:6px 0 2px}
#legend .note{color:var(--sub);margin-top:8px;line-height:1.5;font-size:12px}
#detail{right:16px;top:16px;width:340px;max-height:calc(100% - 32px);overflow:auto}
#detail h2{font-size:22px;margin:0}
#detail .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
#detail .kv div{background:#0b1220;border-radius:12px;padding:10px 12px}
#detail .kv b{display:block;font-size:22px}
#detail .kv span{font-size:12px;color:var(--sub)}
.bar{display:grid;grid-template-columns:96px 1fr 72px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar .t{height:10px;background:#0b1220;border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px}
.bar .v{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600}
tr.on td{color:var(--sky);font-weight:700}
tbody tr{cursor:pointer}
#tip{position:absolute;pointer-events:none;background:#04121f;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;display:none;z-index:5;white-space:nowrap}
@media(max-width:900px){#detail{top:auto;bottom:16px;right:16px;left:16px;width:auto;max-height:42%}#legend{display:none}#head{right:16px;max-width:none}}
</style>
</head>
<body>
<div id="map"></div>
<div id="tip"></div>

  <div class="seg" role="group" aria-label="보기 방식">

    <button id="mChoro" aria-pressed="false">업종 비중 지도</button>

  <label class="sel" id="catWrap" hidden>비중을 볼 업종
    <select id="cat"></select>

</section>

const COLORS = {"음식":[240,122,16],"소매":[0,169,208],"수리·개인":[64,160,64],"과학·기술":[97,85,245],"교육":[224,176,32],"시설관리·임대":[142,142,147],"예술·스포츠":[255,45,85],"부동산":[172,127,94],"보건의료":[0,200,179],"숙박":[203,48,224]};
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const D = DATA.dongs, CATS = DATA.cats, names = Object.keys(D).sort((a,b)=>D[b].n-D[a].n);
const H = 1.1; // 업소 1개 = 1.1m
let mode = 'stack', cat = '음식', sel = names[0];
const catSel = document.getElementById('cat');
catSel.innerHTML = ['생활형(음식+소매+수리·개인)',...CATS].map(c=>`<option>${c}</option>`).join('');
catSel.value = '생활형(음식+소매+수리·개인)'; cat = catSel.value;
const pct = (d,c) => c.startsWith('생활형') ? d.life : +(d.cats[c]/d.n*100).toFixed(1);
const range = c => { const v = names.map(n=>pct(D[n],c)); return [Math.min(...v), Math.max(...v)]; };
const ramp = (t) => { const a=[18,40,80], b=[0,169,208], m=[255,210,120]; const mix=(x,y,k)=>x.map((v,i)=>Math.round(v+(y[i]-v)*k)); return t<.5?mix(a,b,t*2):mix(b,m,(t-.5)*2); };
const chars = Array.from(new Set((names.join('')+'0123456789,개소 ').split('')));

function layers(){
  const [lo,hi] = range(cat);
  const poly = new GeoJsonLayer({id:'poly', data:GEO, pickable:true, stroked:true, filled:true, extruded: mode==='choro', wireframe: mode==='choro',
    getElevation: f => D[f.properties.name].n*H*0.6,
    getFillColor: f => { const d=D[f.properties.name]; if(mode==='choro'){ const t=(pct(d,cat)-lo)/((hi-lo)||1); return [...ramp(t), 235]; } return f.properties.name===sel?[0,100,170,150]:[20,48,92,130]; },
    getLineColor: f => f.properties.name===sel?[255,210,120,255]:[120,160,210,180], getLineWidth: f => f.properties.name===sel?28:10, lineWidthMinPixels:1,
    updateTriggers:{getFillColor:[mode,cat,sel], getElevation:[mode], getLineColor:[sel], getLineWidth:[sel]},
    onClick: i => { if(i.object){ sel=i.object.properties.name; render(); } }, onHover: hover});
  const out = [poly];
  if(mode==='stack'){
    const segs=[]; names.forEach(n=>{ let base=0; CATS.forEach(c=>{ const v=D[n].cats[c]; if(v>0){ segs.push({n,c,v,base}); base+=v; } }); });
    out.push(new ColumnLayer({id:'cols', data:segs, diskResolution:24, radius:95, extruded:true, pickable:true,
      getPosition: s => [D[s.n].lon, D[s.n].lat, s.base*H], getElevation: s => s.v*H, getFillColor: s => [...COLORS[s.c], s.n===sel?255:225],
      material:{ambient:.55,diffuse:.6,shininess:20}, updateTriggers:{getFillColor:[sel]},
      onClick: i => { if(i.object){ sel=i.object.n; render(); } }, onHover: hover}));
  }
  out.push(new TextLayer({id:'lbl', data:names, characterSet:chars, fontFamily:'Pretendard GOV, Malgun Gothic, sans-serif', fontWeight:700,
    getPosition: n => [D[n].lon, D[n].lat, (mode==='stack'? D[n].n*H : D[n].n*H*0.6)+60], getText: n => `${n} ${D[n].n.toLocaleString()}`,
    getSize: 15, getColor:[255,255,255,255], outlineWidth:3, outlineColor:[4,18,31,255], fontSettings:{sdf:true}, billboard:true, getTextAnchor:'middle', getAlignmentBaseline:'bottom', updateTriggers:{getPosition:[mode]}}));
  return out;
}
const tip = document.getElementById('tip');
function hover(i){ if(!i.object){ tip.style.display='none'; return; }
  const n = i.object.n || i.object.properties.name, d=D[n];
  tip.innerHTML = i.object.c ? `<b>${n}</b> · ${i.object.c} ${i.object.v.toLocaleString()}개소 (${(i.object.v/d.n*100).toFixed(1)}%)` : `<b>${n}</b> · 업소 ${d.n.toLocaleString()}개 · ${cat.split('(')[0]} ${pct(d,cat)}%`;
  tip.style.display='block'; tip.style.left=(i.x+14)+'px'; tip.style.top=(i.y+14)+'px'; }

const dg = new DeckGL({container:'map', initialViewState:{longitude:129.095, latitude:35.122, zoom:12.35, pitch:52, bearing:-18, maxPitch:75}, controller:true, layers:layers(),
  getCursor: ({isHovering}) => isHovering?'pointer':'grab', parameters:{clearColor:[0.043,0.071,0.125,1]}});

function legend(){
  const el=document.getElementById('legend');
  if(mode==='stack'){ el.innerHTML = `<div class="row">${CATS.map(c=>`<span><i style="background:${rgb(COLORS[c])}"></i>${c}</span>`).join('')}</div><div class="note">기둥 높이 = 행정동 상가업소 수(업소 1개 = ${H}m). 기둥 위치 = 업소 좌표 중앙값.</div>`; }
  else { const [lo,hi]=range(cat); el.innerHTML = `<b>${cat} 비중</b><div class="ramp" style="background:linear-gradient(90deg,${rgb(ramp(0))},${rgb(ramp(.5))},${rgb(ramp(1))})"></div><div style="display:flex;justify-content:space-between"><span>${lo}%</span><span>${hi}%</span></div><div class="note">면 높이 = 상가업소 수, 색 = 선택 업종 비중.</div>`; }
  el.innerHTML += `<div class="note">출처: 소상공인시장진흥공단 상가(상권)정보 API(남구 17개 행정동 ${DATA.total.toLocaleString()}개소, 2026. 9. 수집) · 경계 vuski/admdongkor 2026. 7. · 추정 개인사업자 = 국세청 2026. 6. 남구 개인사업자 ${DATA.nts.toLocaleString()}명을 업소 수 비율로 배분한 추정치.</div>`;
}
function detail(){
  const d=D[sel], el=document.getElementById('detail');
  const bars = CATS.map(c=>({c,v:d.cats[c]})).sort((a,b)=>b.v-a.v).map(x=>`<div class="bar"><span>${x.c}</span><span class="t"><i style="width:${(x.v/d.n*100).toFixed(1)}%;background:${rgb(COLORS[x.c])}"></i></span><span class="v">${x.v.toLocaleString()} · ${(x.v/d.n*100).toFixed(1)}%</span></div>`).join('');
  el.innerHTML = `<h2>${sel}</h2>
  <div class="kv"><div><b>${d.n.toLocaleString()}</b><span>상가업소 수 (남구의 ${d.share}%)</span></div><div><b>≈${d.est.toLocaleString()}</b><span>추정 개인사업자 (비례 배분)</span></div><div><b>${d.life}%</b><span>생활형 업종 비중</span></div><div><b>${d.top}</b><span>1위 업종</span></div></div>
  ${bars}
  <table><thead><tr><th>행정동</th><th>업소</th><th>추정 사업자</th><th>생활형</th></tr></thead><tbody>${names.map(n=>`<tr data-n="${n}" class="${n===sel?'on':''}"><td>${n}</td><td>${D[n].n.toLocaleString()}</td><td>${D[n].est.toLocaleString()}</td><td>${D[n].life}%</td></tr>`).join('')}</tbody></table>`;
  el.querySelectorAll('tr[data-n]').forEach(r=>r.onclick=()=>{ sel=r.dataset.n; render(); });
}
function render(){ dg.setProps({layers:layers()}); legend(); detail(); }
const bS=document.getElementById('mStack'), bC=document.getElementById('mChoro');
function setMode(m){ mode=m; bS.setAttribute('aria-pressed',m==='stack'); bC.setAttribute('aria-pressed',m==='choro'); document.getElementById('catWrap').hidden = m!=='choro'; render(); }
bS.onclick=()=>setMode('stack'); bC.onclick=()=>setMode('choro'); catSel.onchange=()=>{ cat=catSel.value; render(); };
render();
</script>
</body>
</html>
